version: "3.9"
services:
  db:
    image: mysql:8.0
    container_name: spendwise_db
    environment:
      MYSQL_DATABASE: spendwise
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: spendwise
      MYSQL_PASSWORD: spendwise
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: spendwise_api
    environment:
      MYSQL_USER: spendwise
      MYSQL_PASSWORD: spendwise
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DB: spendwise
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head || alembic upgrade head && uvicorn server.main:app --host 0.0.0.0 --port 8000"

  client:
    build: ./client
    container_name: spendwise_client
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  db_data:
